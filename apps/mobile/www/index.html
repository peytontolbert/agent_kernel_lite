<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agent Kernel Lite</title>
  <link rel="stylesheet" href="./shell/styles.css">
</head>
<body>
  <main>
    <section class="panel">
      <div class="brand">
        <span class="mark">AK</span>
        <div>
          <h1>Agent Kernel Lite</h1>
          <p>Local research shell for GitHub releases and Hugging Face packs.</p>
        </div>
      </div>

      <div class="actions">
        <a class="primary" href="./app/">Open Bundled App</a>
        <button id="checkReleaseButton" type="button">Check Release</button>
      </div>

      <form id="releaseForm" autocomplete="off">
        <label for="releaseManifestUrl">GitHub release manifest</label>
        <input
          id="releaseManifestUrl"
          name="releaseManifestUrl"
          type="url"
          inputmode="url"
          spellcheck="false"
          autocapitalize="none"
          value="https://github.com/peytontolbert/agent_kernel_lite/releases/download/v6/app-release-manifest.json"
        >
        <button type="submit">Cache Verified Assets</button>
      </form>

      <p id="status" class="status">Bundled app is available offline. Release assets must be immutable GitHub release URLs.</p>
      <div id="releaseDetails" class="details" hidden></div>
    </section>
  </main>

  <script src="./shell/app.js"></script>
</body>
</html>
