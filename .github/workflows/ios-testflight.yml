name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build and upload iOS
    runs-on: macos-26
    timeout-minutes: 60

    env:
      APP_SCHEME: App
      APP_WORKSPACE: apps/mobile/ios/App/App.xcworkspace
      BUNDLE_ID: com.peytontolbert.agentkernellite

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Prepare Capacitor iOS project
        working-directory: apps/mobile
        run: |
          npm ci
          npm run sync:web
          npm run check
          npx cap sync ios

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          : "${ASC_KEY_ID:?Missing GitHub secret APP_STORE_CONNECT_API_KEY_ID}"
          : "${ASC_KEY_P8_BASE64:?Missing GitHub secret APP_STORE_CONNECT_API_KEY_P8_BASE64}"
          mkdir -p "$RUNNER_TEMP/private_keys"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          key_id = os.environ["ASC_KEY_ID"]
          raw = os.environ["ASC_KEY_P8_BASE64"]
          out = Path(os.environ["RUNNER_TEMP"]) / "private_keys" / f"AuthKey_{key_id}.p8"
          out.write_bytes(base64.b64decode(raw))
          PY
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          : "${APPLE_TEAM_ID:?Missing GitHub secret APPLE_TEAM_ID}"
          : "${ASC_KEY_ID:?Missing GitHub secret APP_STORE_CONNECT_API_KEY_ID}"
          : "${ASC_ISSUER_ID:?Missing GitHub secret APP_STORE_CONNECT_API_ISSUER_ID}"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild archive \
            -workspace "$APP_WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/AgentKernelLite.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_TEAM_ID:?Missing GitHub secret APPLE_TEAM_ID}"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Upload archive to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          : "${ASC_KEY_ID:?Missing GitHub secret APP_STORE_CONNECT_API_KEY_ID}"
          : "${ASC_ISSUER_ID:?Missing GitHub secret APP_STORE_CONNECT_API_ISSUER_ID}"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AgentKernelLite.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
